name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Tag zgodny z wersją w package.json
        shell: bash
        run: |
          VER=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_NAME}" != "v${VER}" ]; then
            echo "Tag ${GITHUB_REF_NAME} nie pasuje do wersji ${VER} z package.json (oczekiwano v${VER})"
            exit 1
          fi
      - run: npm ci
      - run: npm run dist:win
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            release/WorkspaceFPV-Setup.exe
            release/WorkspaceFPV-Setup.exe.blockmap
            release/latest.yml
          fail_on_unmatched_files: true
          generate_release_notes: true
